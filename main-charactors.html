<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Dragon Ball Universe - Main Characters Portal</title>
    <meta name="description" content="Meet the legendary top 5 main characters of Dragon Ball: Goku, Vegeta, Gohan, Piccolo, and Trunks. View their profiles, Ki levels, and bios." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://dragonball-api.com">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/main-charactors.css" />
    <link rel="stylesheet" href="/css/index.css" />
  </head>
  <body>
    <nav class="navbar bg-body-tertiary sticky-top nav-menu">
      <div class="container-fluid">
        <a class="navbar-brand nav-logo" href="index.html" id="nav-brand-logo">Dragon Ball</a>
        <button
          class="navbar-toggler nav-toggle"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasNavbar"
          aria-controls="offcanvasNavbar"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <div
      class="offcanvas offcanvas-end nav-offcanvas"
      tabindex="-1"
      id="offcanvasNavbar"
      aria-labelledby="offcanvasNavbarLabel"
    >
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Menu</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3 nav-list">
          <li class="nav-item">
            <a
              class="nav-link"
              href="index.html"
              id="nav-link-home"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link active"
              aria-current="page"
              href="main-charactors.html"
              id="nav-link-chars"
              >Main characters</a
            >
          </li>
        </ul>
      </div>
    </div>

    <main class="container fade-in">
      <h1 class="page-title">Legendary Fighters</h1>
      
      <div id="loading" class="loading-state">
        <div class="loader-spinner"></div>
        <p class="loader-text">Gathering Ki Energy...</p>
      </div>

      <div id="error" class="error-state hide">
        <p class="error-text">💥 Er is een fout opgetreden bij het laden van de krijgers. Probeer het later opnieuw.</p>
      </div>

      <div id="characters-grid" class="characters-grid hide">
      </div>
    </main>

    <div id="characterModal" class="modal hide-modal fade-in">
      <div class="modal-overlay" id="modal-overlay"></div>
      <div class="modal-content modal-shadow">
        <button class="close-btn" id="close-modal" aria-label="Close modal">&times;</button>
        
        <div class="modal-body">
          <div class="modal-left">
            <img id="modal-img" src="" alt="Character Image" />
          </div>
          
          <div class="modal-right">
            <h2 id="modal-name">Name</h2>
            
            <div class="modal-info">
              <p><strong>Race:</strong> <span id="modal-race"></span></p>
              <p><strong>Gender:</strong> <span id="modal-gender"></span></p>
              <p><strong>Series:</strong> <span id="modal-series"></span></p>
              
              <div class="ki-container">
                <div class="ki-header">
                  <span class="ki-label">Ki Power Level</span>
                  <span class="ki-values"><span id="modal-ki">0</span> / <span id="modal-maxKi">0</span></span>
                </div>
                <div class="ki-progress-bg">
                  <div id="modal-ki-fill" class="ki-progress-fill"></div>
                </div>
              </div>
            </div>
            
            <div class="modal-desc-container">
              <p><strong>Biography / Description:</strong></p>
              <p id="modal-description" class="description-text"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>&copy; 2026 Dragon Ball Universe Portal.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/javascript/shared.js"></script>
    <script src="/javascript/main-charactors.js"></script>
  </body>
</html>
